[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budget-me"
version = "0.1.0"
description = "Self-hosted personal budgeting with Plaid and PostgreSQL"
authors = [
    {name = "Budget Me contributors"},
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "uvicorn[standard]>=0.24.0",
    "loguru>=0.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "plaid-python>=22.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0.0",
    "Authlib>=1.3.2",
    "python-telegram-bot>=22.6",
    "plotly>=5.18.0",
    "psycopg2-binary>=2.9.11",
    "streamlit>=1.42.0",
]

[project.urls]
Homepage = "https://github.com/jyaunches/budget-me"
Repository = "https://github.com/jyaunches/budget-me"
Issues = "https://github.com/jyaunches/budget-me/issues"

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0,<0.15.0",
]

[project.scripts]
budget-me = "budget_me.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
markers = [
    "integration: opt-in tests that require Docker, a provider, or a disposable database",
    "database_integration: provider-free tests that require an explicitly named disposable PostgreSQL database",
    "plaid_provider_integration: tests that make real Plaid Sandbox calls and write only to an explicitly named disposable PostgreSQL database",
    "requires_database: transitional tests that need an explicitly configured disposable database",
]
addopts = [
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "-m=not requires_database and not integration and not database_integration and not plaid_provider_integration",
]

[tool.coverage.run]
source = ["src/budget_me"]
omit = ["tests/*", "src/budget_me/__main__.py"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["budget_me"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
